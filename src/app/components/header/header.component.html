<header class="header">
  <div class="header__inner">
    <a class="brand" routerLink="/" aria-label="Página inicial">
      <span class="brand__logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor">
          <path d="M8.5 3v15.6l2.9.9V7.4c0-.6.3-1 .8-.8.6.2.7.7.7 1.3v4.3c1.8.9 3.3-.1 3.3-2.5 0-2.5-.9-3.6-3.4-4.5C11.6 4.7 9.9 4.2 8.5 3M14 18.4l4.6-1.6c.5-.2.6-.4.2-.6-.4-.2-1.2-.2-1.8 0L14 17.3v-1.6l.2-.1s1.6-.6 3.9-.8c1.8-.2 4 .1 5.7.7 1.9.7 2.1 1.8.4 2.4L14 20.9v-2.5M3.6 18.2c-2-.5-2.3-1.7-1.4-2.4.8-.6 2.3-1.1 2.3-1.1l3-1.1v1.7l-2.2.8c-.4.1-.4.4 0 .5.4.2 1.1.1 1.5 0l.7-.2v1.5c-1.3.2-2.7.2-3.9-.2" />
        </svg>
      </span>
      <span class="brand__name">PS<strong>Interface</strong></span>
    </a>

    <nav class="nav" aria-label="Navegação principal">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Explorar</a>
      <a routerLink="/" routerLinkActive="active" [queryParams]="{ cat: 'promocoes' }">Ofertas</a>
      <a routerLink="/" routerLinkActive="active" [queryParams]="{ cat: 'ps5' }">PS5</a>
    </nav>

    <form class="search" (ngSubmit)="buscar()" role="search">
      <input
        type="search"
        name="busca"
        placeholder="Buscar jogos, estúdios..."
        [(ngModel)]="termo"
        aria-label="Buscar jogos"
      />
      <button type="submit" aria-label="Buscar">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="7" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
      </button>
    </form>

    <a class="cart" routerLink="/carrinho" aria-label="Carrinho">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="9" cy="21" r="1" />
        <circle cx="20" cy="21" r="1" />
        <path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6" />
      </svg>
      @if (cart.quantidadeTotal() > 0) {
        <span class="cart__count">{{ cart.quantidadeTotal() }}</span>
      }
    </a>
  </div>
</header>
